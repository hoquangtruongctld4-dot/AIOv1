<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Clappr Player</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: black;
        }

        #player {
            width: 100%;
            height: 100%;
        }
    </style>
    <!-- Nạp thư viện Clappr từ CDN (hoàn toàn miễn phí) -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/clappr@latest/dist/clappr.min.js"></script>
</head>
<body>
    <!-- Div này là nơi Clappr sẽ được hiển thị -->
    <div id="player"></div>

    <script>
        let player = null;

        // Hàm này được gọi từ code C#
        function playVideo(mediaUrl) {
            // Hủy trình phát cũ nếu đang tồn tại (khi người dùng chọn phim mới)
            if (player) {
                player.destroy();
                player = null;
            }

            // Nếu không có URL thì không làm gì cả
            if (!mediaUrl) {
                return;
            }

            // Khởi tạo trình phát Clappr
            player = new Clappr.Player({
                source: mediaUrl,          // Link video M3U8 hoặc MP4
                parentId: "#player",       // Gắn vào div có id="player"
                width: '100%',
                height: '100%',
                autoPlay: true,            // Tự động phát ngay lập tức
                poster: 'about:blank'      // Không hiển thị poster
            });
        }
    </script>
</body>
</html>
